<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Shop Scheduling</title>
    <style>
        :root{
            --bg:#ffffff;
            --tx:#1a1a1a;
            --tx2:#666;
            --tx3:#999;
            --line:#e2e2e2;
            --line2:#111;
            --sel-bg:#f2f2f2;
            --sel-bd:#111;
            --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
            --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
        }
        *{box-sizing:border-box}
        html,body{margin:0}
        body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;
            -webkit-font-smoothing:antialiased}
        .wrap{max-width:1180px;margin:0 auto;padding:28px 26px 60px}

        h1{font-size:17px;font-weight:600;margin:0 0 2px}
        .sub{font-size:12.5px;color:var(--tx2);margin-bottom:22px}

        .row{display:flex;flex-wrap:wrap;gap:26px;margin-bottom:18px}
        .field .lab{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
        .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:fit-content}
        .seg button{font-family:var(--sans);font-size:13px;color:var(--tx2);background:#fff;border:none;
            border-right:1px solid var(--line);padding:7px 15px;cursor:pointer;transition:.12s}
        .seg button:last-child{border-right:none}
        .seg button:hover{background:#fafafa;color:var(--tx)}
        .seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--tx);font-weight:600}
        .seg button.dis{color:#ccc;cursor:not-allowed;background:#fff}
        .seg button.dis:hover{background:#fff}

        .stats{display:flex;flex-wrap:wrap;gap:34px;padding:16px 0 20px;border-top:1px solid var(--line);
            border-bottom:1px solid var(--line);margin-bottom:22px}
        .stat .k{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em}
        .stat .v{font-family:var(--mono);font-size:20px;font-weight:500;margin-top:3px}
        .stat .v small{font-size:12px;color:var(--tx3);font-weight:400}
        .stat .v.ok{color:#1a7f37}.stat .v.bad{color:#c0392b}

        .gbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
        .gbar .t{font-size:13px;font-weight:600}
        .gbar .tools{font-family:var(--mono);font-size:11.5px;color:var(--tx3)}
        .gbar .tools button{font-family:var(--mono);font-size:11.5px;color:var(--tx2);background:#fff;
            border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer;margin-left:5px}
        .gbar .tools button:hover{border-color:var(--tx3);color:var(--tx)}
        #ganttWrap{position:relative;border:1px solid var(--line);border-radius:6px}
        #gantt{display:block;width:100%;cursor:grab;touch-action:none}
        #gantt.drag{cursor:grabbing}
        #tip{position:absolute;pointer-events:none;z-index:5;opacity:0;transition:opacity .08s;
            background:#fff;border:1px solid #111;border-radius:5px;padding:6px 9px;
            font-family:var(--mono);font-size:11.5px;color:#111;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:260px}
        #tip .d{color:var(--tx2)}
        .hint{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:7px}

        h2{font-size:13px;font-weight:600;margin:30px 0 10px}
        table.cmp{border-collapse:collapse;font-size:13px;min-width:340px}
        table.cmp th,table.cmp td{text-align:left;padding:7px 18px 7px 0;border-bottom:1px solid var(--line)}
        table.cmp th{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
        table.cmp td{font-family:var(--mono)}
        table.cmp tr.sel td{font-weight:600}
        table.cmp td.num{text-align:right;padding-right:0}
        table.cmp .best{color:#1a7f37}
        table.cmp .lim{color:var(--tx3)}

        details.note{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
        details.note summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none}
        details.note summary::-webkit-details-marker{display:none}
        details.note summary::before{content:"▸ ";color:var(--tx3)}
        details.note[open] summary::before{content:"▾ "}
        details.note .body{font-size:13px;color:var(--tx2);line-height:1.7;margin-top:10px;max-width:70ch}
        details.note code{font-family:var(--mono);background:#f5f5f5;padding:1px 5px;border-radius:3px;font-size:12px;color:#111}
        footer{margin-top:34px;font-family:var(--mono);font-size:11px;color:var(--tx3)}
    </style>
</head>
<body>
<div class="wrap">
    <h1>Job Shop Scheduling</h1>
    <div class="row">
        <div class="field">
            <div class="lab">Datensatz</div>
            <div class="seg" id="segData"></div>
        </div>
        <div class="field">
            <div class="lab">Algorithmus</div>
            <div class="seg" id="segAlgo"></div>
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="gbar">
        <div class="t" id="gTitle">Gantt</div>
        <div class="tools">
            <span id="gMeta"></span>
            <button id="zOut">−</button><button id="zIn">+</button><button id="zFit">Reset</button>
        </div>
    </div>
    <div id="ganttWrap"><canvas id="gantt"></canvas><div id="tip"></div></div>

    <h2>Vergleich</h2>
    <table class="cmp"><thead><tr><th>Algorithmus</th><th class="num">Makespan</th><th class="num">Zeit</th><th class="num">Expandiert</th></tr></thead>
        <tbody id="cmpBody"></tbody></table>

</div>

    const PAL=['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf',
        '#aec7e8','#ffbb78','#98df8a','#ff9896','#c5b0d5','#c49c94','#f7b6d2','#c7c7c7','#dbdb8d','#9edae5'];
    const ALGOS=[{id:'GREEDY',name:'Greedy'},{id:'BEAM',name:'Beam'},{id:'TABU',name:'Tabu'}];
    const DATASETS=Object.keys(DATA.instances);
    let state={ds:DATASETS.includes('demoanlage')?'demoanlage':DATASETS[0],algo:'BEAM'};
    let view={zoom:1,offX:0,fit:1};

    const inst=()=>DATA.instances[state.ds];
    const result=()=>inst().results[state.algo];
    const isSeconds=()=>state.ds==='demoanlage';
    function jobColor(j){const t=inst().jobTypeOfJob?inst().jobTypeOfJob[j]:j;return PAL[t%PAL.length];}
    function fmtTime(t){
        if(!isSeconds())return Math.round(t).toLocaleString('de-DE');
        t=Math.round(t);const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
        if(h>0)return h+'h '+String(m).padStart(2,'0')+'m';
        if(m>0)return m+'m '+String(s).padStart(2,'0')+'s';return s+'s';
    }
    function fmtNum(n){return n==null?'—':Number(n).toLocaleString('de-DE');}

    function buildSegs(){
        const sd=document.getElementById('segData');sd.innerHTML='';
        DATASETS.forEach(k=>{const b=document.createElement('button');
            b.textContent=DATA.instances[k].label.replace(/\s*\(.*\)/,'');
            b.dataset.k=k;b.onclick=()=>{state.ds=k;state.algo=pickAlgo(k,state.algo);view.zoom=1;view.offX=0;render();};
            sd.appendChild(b);});
        const sa=document.getElementById('segAlgo');sa.innerHTML='';
        ALGOS.forEach(a=>{const b=document.createElement('button');b.textContent=a.name;b.dataset.a=a.id;
            b.onclick=()=>{const r=inst().results[a.id];if(r&&r.schedule){state.algo=a.id;render();}};sa.appendChild(b);});
    }
    function pickAlgo(ds,algo){const r=DATA.instances[ds].results;if(r[algo]&&r[algo].schedule)return algo;
        for(const a of['BEAM','TABU','GREEDY'])if(r[a]&&r[a].schedule)return a;return algo;}
    function syncSegs(){
        document.querySelectorAll('#segData button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===state.ds));
        document.querySelectorAll('#segAlgo button').forEach(b=>{const r=inst().results[b.dataset.a];const ok=r&&r.schedule;
            b.setAttribute('aria-pressed',b.dataset.a===state.algo);b.classList.toggle('dis',!ok);
            b.title=ok?'':'kein Ergebnis im Limit';});
    }
    function renderStats(){
        const r=result();
        const cells=[
            {k:'Makespan',v:r.makespan==null?'—':fmtTime(r.makespan),sub:r.makespan!=null&&isSeconds()?fmtNum(r.makespan)+' s':''},
            {k:'Rechenzeit',v:fmtNum(r.timeMs),sub:'ms'},
            {k:'Expandiert',v:state.algo==='TABU'?'n/a':fmtNum(r.expanded)},
            {k:'Validität',v:r.schedule?(r.valid?'gültig':'ungültig'):'—',cls:r.schedule?(r.valid?'ok':'bad'):''},
        ];
        document.getElementById('stats').innerHTML=cells.map(c=>
            `<div class="stat"><div class="k">${c.k}</div><div class="v ${c.cls||''}">${c.v}${c.sub?` <small>${c.sub}</small>`:''}</div></div>`).join('');
    }
    function renderCmp(){
        const i=inst();
        const best=Math.min(...ALGOS.map(a=>i.results[a.id].makespan).filter(x=>x!=null));
        document.getElementById('cmpBody').innerHTML=ALGOS.map(a=>{
            const r=i.results[a.id];const has=r.makespan!=null;
            return `<tr class="${a.id===state.algo?'sel':''}"><td>${a.name}</td>`+
                `<td class="num ${has?(r.makespan===best?'best':''):'lim'}">${has?fmtTime(r.makespan):'Limit'}</td>`+
                `<td class="num">${fmtNum(r.timeMs)} ms</td>`+
                `<td class="num">${a.id==='TABU'?'n/a':(has?fmtNum(r.expanded):'—')}</td></tr>`;
        }).join('');
    }

    const cv=document.getElementById('gantt'),ctx=cv.getContext('2d'),tip=document.getElementById('tip');
    let LAY={},hit=[];
    function layout(){
        const i=inst(),r=result();
        LAY.gutter=state.ds==='demoanlage'?196:96;
        LAY.axis=26;LAY.pad=10;
        LAY.rows=i.machineCount;
        LAY.rowH=Math.max(16,Math.min(30,Math.floor(540/LAY.rows)));
        LAY.plotH=LAY.rowH*LAY.rows;
        LAY.H=LAY.plotH+LAY.axis+LAY.pad;
        LAY.W=cv.parentElement.clientWidth;
        LAY.plotW=LAY.W-LAY.gutter-LAY.pad;
        LAY.maxT=r.makespan||1;
        view.fit=LAY.plotW/LAY.maxT;
        const dpr=window.devicePixelRatio||1;
        cv.width=LAY.W*dpr;cv.height=LAY.H*dpr;cv.style.width=LAY.W+'px';cv.style.height=LAY.H+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    const ppt=()=>view.fit*view.zoom;
    function clampX(){const cw=LAY.maxT*ppt();view.offX=Math.min(Math.max(0,cw-LAY.plotW),Math.max(0,view.offX));}
    function niceStep(span,n){const raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),x=raw/mag;
        let f;if(x<1.5)f=1;else if(x<3)f=2;else if(x<7)f=5;else f=10;return f*mag;}
    function draw(){
        const i=inst(),r=result(),names=i.machineNames||{};
        clampX();ctx.clearRect(0,0,LAY.W,LAY.H);
        const P=ppt(),x0=LAY.gutter;
        ctx.textBaseline='middle';
        for(let m=0;m<LAY.rows;m++){
            const y=LAY.axis+m*LAY.rowH;
            ctx.strokeStyle='#f0f0f0';ctx.beginPath();ctx.moveTo(x0,y+.5);ctx.lineTo(LAY.W-LAY.pad,y+.5);ctx.stroke();
            ctx.fillStyle='#444';ctx.font='11px '+getFont();
            let nm=state.ds==='demoanlage'?String(names[m]||('M'+m)).replace(/^\d[\d\s–-]*\s*/,''):('Machine '+m);
            const maxc=Math.floor((LAY.gutter-14)/6);if(nm.length>maxc)nm=nm.slice(0,maxc-1)+'…';
            ctx.textAlign='left';ctx.fillText(nm,4,y+LAY.rowH/2);
        }
        const t0=view.offX/P,t1=(view.offX+LAY.plotW)/P,step=niceStep(t1-t0,7);
        ctx.textAlign='center';
        for(let t=Math.floor(t0/step)*step;t<=t1+step;t+=step){
            const x=x0+(t*P-view.offX);if(x<x0-1||x>LAY.W-LAY.pad+1)continue;
            ctx.strokeStyle='#e6e6e6';ctx.setLineDash([3,3]);
            ctx.beginPath();ctx.moveTo(x+.5,LAY.axis);ctx.lineTo(x+.5,LAY.axis+LAY.plotH);ctx.stroke();ctx.setLineDash([]);
            ctx.fillStyle='#888';ctx.font='10px '+getFont();ctx.fillText(fmtTime(t),x,12);
        }
        ctx.save();ctx.beginPath();ctx.rect(x0,LAY.axis,LAY.plotW,LAY.plotH);ctx.clip();hit=[];
        for(const op of r.schedule){
            const x=x0+(op.s*P-view.offX),w=Math.max(1.2,(op.e-op.s)*P);
            if(x+w<x0||x>LAY.W)continue;
            const y=LAY.axis+op.m*LAY.rowH+2,h=LAY.rowH-4;
            ctx.fillStyle=jobColor(op.j);ctx.fillRect(x,y,w,h);
            if(w>3){ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);}
            if(w>18){ctx.fillStyle='#111';ctx.font='10px '+getFont();ctx.textAlign='center';
                ctx.fillText(op.j,x+w/2,y+h/2);}
            hit.push({x,y,w,h,op});
        }
        ctx.restore();
        ctx.strokeStyle='#111';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(x0+.5,LAY.axis);ctx.lineTo(x0+.5,LAY.axis+LAY.plotH);
        ctx.lineTo(LAY.W-LAY.pad,LAY.axis+LAY.plotH);ctx.stroke();
    }
    function getFont(){return getComputedStyle(document.body).fontFamily;}
    function roundNoop(){}
    let drag=null;
    cv.addEventListener('mousedown',e=>{drag={x:e.offsetX,off:view.offX};cv.classList.add('drag');});
    window.addEventListener('mouseup',()=>{drag=null;cv.classList.remove('drag');});
    cv.addEventListener('mousemove',e=>{
        if(drag){view.offX=drag.off-(e.offsetX-drag.x);draw();return;}
        const mx=e.offsetX,my=e.offsetY;let f=null;
        for(let k=hit.length-1;k>=0;k--){const b=hit[k];if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){f=b;break;}}
        if(f){const op=f.op,i=inst();let bath=(i.machineNames&&i.machineNames[op.m])||('Machine '+op.m);
            let jt='';if(state.ds==='demoanlage'){const t=i.jobTypeOfJob[op.j];jt=(i.jobtypeNames&&i.jobtypeNames['Typ'+(t+1)])||'';}
            tip.innerHTML=`<b>Job ${op.j}</b>${jt?' · '+jt:''}<div class="d">${bath}</div>`+
                `<div class="d">${fmtTime(op.s)} → ${fmtTime(op.e)} · Δ ${fmtTime(op.e-op.s)}</div>`;
            tip.style.opacity=1;let tx=mx+12;if(tx+250>LAY.W)tx=mx-250;tip.style.left=tx+'px';tip.style.top=(my+12)+'px';
        }else tip.style.opacity=0;
    });
    cv.addEventListener('mouseleave',()=>tip.style.opacity=0);
    cv.addEventListener('wheel',e=>{
        if(e.shiftKey){view.offX+=e.deltaY;draw();e.preventDefault();return;}
        const mx=e.offsetX,tAt=(view.offX+(mx-LAY.gutter))/ppt(),f=e.deltaY<0?1.15:1/1.15;
        setZoom(view.zoom*f,tAt,mx);e.preventDefault();
    },{passive:false});
    function setZoom(z,tA,sx){z=Math.max(1,Math.min(200,z));view.zoom=z;
        if(tA!=null)view.offX=tA*ppt()-(sx-LAY.gutter);draw();}
    document.getElementById('zIn').onclick=()=>{const c=(view.offX+LAY.plotW/2)/ppt();setZoom(view.zoom*1.4,c,LAY.gutter+LAY.plotW/2);};
    document.getElementById('zOut').onclick=()=>{const c=(view.offX+LAY.plotW/2)/ppt();setZoom(view.zoom/1.4,c,LAY.gutter+LAY.plotW/2);};
    document.getElementById('zFit').onclick=()=>{view.zoom=1;view.offX=0;draw();};

    function render(){
        syncSegs();renderStats();renderCmp();
        const r=result();
        document.getElementById('gTitle').textContent=inst().label;
        document.getElementById('gMeta').textContent=r.schedule?`${r.schedule.length} Ops · ${fmtTime(r.makespan)}  `:'kein Ergebnis  ';
        layout();clampX();draw();
    }
    buildSegs();render();
    let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();draw();},120);});
</script>
