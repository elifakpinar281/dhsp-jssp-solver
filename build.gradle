plugins {
    id 'java'
    id 'application'
}

group = 'at.fhv'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'org.jfree:jfreechart:1.5.4'
    implementation 'tools.profiler:jfr-converter:4.5'
    implementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'at.fhv.Main'
    applicationDefaultJvmArgs = ['-Xmx4g']
}

run {
    workingDir = project.projectDir
}

tasks.register('regression', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'at.fhv.experiment.RegressionCheck'
    workingDir = projectDir
    jvmArgs '-Xmx4g'
}

def profiler = System.getProperty('user.home') + '/tools/async-profiler/lib/libasyncProfiler.so'
file('profiles').mkdirs()

tasks.register('profileCpu', JavaExec) {
    group = 'profiling'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'at.fhv.Main'
    workingDir = projectDir
    jvmArgs '-Xmx4g',
            '-XX:+UnlockDiagnosticVMOptions',
            '-XX:+DebugNonSafepoints',
            '-agentpath:' + profiler + '=start,event=cpu,file=profiles/cpu-%t.html'
}

tasks.register('profileAllocation', JavaExec) {
    group = 'profiling'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'at.fhv.Main'
    workingDir = projectDir
    jvmArgs '-Xmx4g',
            '-XX:+UnlockDiagnosticVMOptions',
            '-XX:+DebugNonSafepoints',
            '-agentpath:' + profiler + '=start,event=alloc,file=profiles/alloc-%t.html'
}